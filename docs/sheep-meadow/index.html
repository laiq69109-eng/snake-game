<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef3dc">
<meta name="description" content="《绵羊牧场》是一款原创牧场堆叠三消小游戏。翻开牌堆，凑齐三张，挑战十个关卡。">
<meta property="og:title" content="绵羊牧场">
<meta property="og:description" content="翻开牌堆，凑齐三张。你能过第几关？">
<link rel="icon" href="data:,">
<title>绵羊牧场 · 堆叠三消</title>
<style>:root{
  color-scheme:light;color:#29443a;background:#ecf2d8;
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --ink:#29443a;--muted:#54694d;--green:#38664c;--paper:#fff9e9;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;background:linear-gradient(170deg,#f0f4dd 0%,#eef3d6 38%,#d2e1ac 100%);overscroll-behavior-y:none}
[hidden]{display:none!important}
button,input,textarea{font:inherit}
button{border:0;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #815b31;outline-offset:3px}
button:disabled{cursor:default}
button:active{filter:brightness(.96)}
p,h1,h2{margin:0}
.definitions{position:absolute;pointer-events:none;overflow:hidden}
.world{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.app{position:relative;width:min(100%,480px);min-height:100vh;min-height:100dvh;margin:auto;display:flex;flex-direction:column;
  padding:max(14px,env(safe-area-inset-top)) 22px max(18px,env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#f5f7e8 0%,#edf3d8 62%,#e0ebc5 100%);box-shadow:0 0 80px #5c72412c}
.app.in-game{height:max(100vh,493px);height:max(100dvh,493px)}
.topbar{display:flex;align-items:center;justify-content:space-between;flex:none;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:9px;background:none;padding:0;font-size:16px;letter-spacing:.055em;font-weight:820}
.brand-mark{display:grid;place-items:center;width:37px;height:37px;border-radius:13px;background:#e3ebcc;border:1px solid #d4e0ba;box-shadow:inset 0 1px #f8fae9}
.brand-mark svg{width:33px;height:33px}
.circle{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:#fffbef;border:1px solid #dbe1c5;box-shadow:0 2px 0 #dfe6c9}
.icon{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle;pointer-events:none}
.home{margin:auto 0;display:grid;gap:19px;padding-bottom:8px}
.hero{position:relative;min-height:315px;height:min(51vh,394px);isolation:isolate;overflow:hidden;border-radius:29px;
  background:#c7dba9;border:1px solid #9fbd88;box-shadow:inset 0 0 0 2px #f8f9d55e,0 5px 0 #c9d6a7,0 12px 26px #5676371a}
.hero-art{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero-copy{padding:29px 18px 0;text-align:center;position:relative}
.hero-kicker{display:inline-flex;align-items:center;gap:5px;border:1px solid #edf0cc;background:#f3f3d8;color:#39583e;border-radius:100px;padding:5px 11px;font-size:13px;letter-spacing:.13em;font-weight:740}
.hero-kicker .icon{width:13px;height:13px;color:#ae8240}
.hero h1{font-size:clamp(42px,10.5vw,56px);letter-spacing:.045em;line-height:1.18;font-weight:900;margin:9px 0 3px;text-shadow:0 2px 0 #eff3ce}
.hero p{font-size:15px;font-weight:700;letter-spacing:.08em;color:#3b593c}
.home-actions{display:grid;grid-template-columns:minmax(0,1.42fr) minmax(0,1fr);gap:10px;margin-top:5px}
.primary,.secondary{display:flex;justify-content:center;align-items:center;gap:8px;min-height:54px;padding:10px 12px;border-radius:15px;font-weight:800;font-size:16px;letter-spacing:.025em;line-height:1.3}
.primary{background:linear-gradient(#47795a,#346348);border:1px solid #2e6247;color:#fff9e6;box-shadow:0 3px 0 #274937,inset 0 1px #7ba484}
.secondary{background:#fbf9e9;border:1px solid #d4dcb8;color:#365643;box-shadow:0 3px 0 #d0dbb2,inset 0 1px #fffdf1}
.home-progress{padding:4px 3px 0;display:flex;align-items:center;gap:12px;color:#4e6549;font-size:13px;font-weight:700}
.home-track{height:7px;background:#d0ddaf;box-shadow:inset 0 1px 2px #79965845;border-radius:30px;flex:1;overflow:hidden}
.home-track span{display:block;background:#668c58;height:100%;border-radius:inherit}
.home-progress strong,.remaining strong,.count{font-variant-numeric:tabular-nums}
.game{display:flex;flex-direction:column;flex:1;min-height:0;gap:12px}
.level-head{display:flex;align-items:end;justify-content:space-between;gap:6px;flex:none;padding:0 1px}
.level-number{color:#507154;font-weight:830;font-size:13px;letter-spacing:.115em;line-height:1.25}
.level-head h1{font-size:clamp(23px,6.8vw,32px);line-height:1.22;font-weight:900;letter-spacing:.055em;margin-top:4px}
.remaining{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 12px;border-radius:11px;color:#466142;background:#e5edce;border:1px solid #d6e2b9;font-size:13px;font-weight:760;white-space:nowrap}
.remaining strong{font-size:21px;line-height:1;color:#2b563d}
.game-area{flex:1;min-height:0;display:grid;place-items:center;container-type:size}
.board{position:relative;width:min(100%,calc(100cqh * 400 / 364));aspect-ratio:400/364;isolation:isolate;border-radius:23px;overflow:hidden;
  background:#ccdd9f;box-shadow:0 3px 0 #b6c98d,0 6px 16px #5e7c361f;transform-origin:center 75%}
.board::after{content:"";position:absolute;inset:0;border:1px solid #a8bd7e;box-shadow:inset 0 1px #f0f6d3;border-radius:inherit;pointer-events:none;z-index:300}
.board-art,.board-cards{position:absolute;inset:0;width:100%;height:100%}
.board-art{pointer-events:none}
.tile{--face:#fff6dc;--face-base:#f4e5bf;display:grid;place-items:center;padding:0;isolation:isolate;border-radius:16% / 16%;
  background:linear-gradient(151deg,var(--face),var(--face-base));border:1px solid #fff9e5;
  box-shadow:0 2px 0 #a5835b,0 3px 5px #41351838,inset 0 -1px #bc96594f}
.tile svg{width:85%;height:85%;pointer-events:none;display:block}
.tile[data-type="1"]{--face:#fff1d9;--face-base:#f8dcb4}
.tile[data-type="2"],.tile[data-type="12"]{--face:#fff7d5;--face-base:#f4e5ab}
.tile[data-type="3"]{--face:#fceef1;--face-base:#eed6e4}
.tile[data-type="4"],.tile[data-type="11"]{--face:#f5edda;--face-base:#ecd6b7}
.tile[data-type="5"],.tile[data-type="8"]{--face:#ffece4;--face-base:#f3d8cb}
.tile[data-type="6"]{--face:#fff3cf;--face-base:#f2deb0}
.tile[data-type="7"]{--face:#f1ebfa;--face-base:#e3d9ed}
.tile[data-type="9"]{--face:#e4f3e9;--face-base:#d4e6d9}
.tile[data-type="10"]{--face:#faeadf;--face-base:#e9d8c5}
.tile[data-type="13"]{--face:#ecf4f9;--face-base:#d7e5ea}
.board-tile{position:absolute;box-shadow:0 2px 0 #9b784f,0 var(--shadow,4px) 5px #3b422b4d,inset 0 -1px #b188524f}
.board-tile.covered{background:linear-gradient(151deg,#c2bb96,#adab81);border-color:#d6cca4;box-shadow:0 2px 0 #827453,0 2px 3px #39382148}
.board-tile.covered svg{opacity:.69;filter:saturate(.63) brightness(.85)}
.board-tile.covered:active{filter:none}
.board-tile:focus-visible{outline-offset:-4px}
.guide{display:grid;justify-items:center;gap:0;position:absolute;transform:translate(-50%,-93%);z-index:250;color:#fff9de;pointer-events:none;filter:drop-shadow(0 2px 2px #21442a45)}
.guide span{background:#38634a;padding:4px 10px;border-radius:100px;font-size:13px;font-weight:850;white-space:nowrap}
.guide svg{color:#38634a;animation:bob .95s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(4px)}}
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;flex:none}
.tool{position:relative;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;min-width:0;min-height:43px;
  padding:4px 9px 4px 5px;border-radius:11px;background:#fbf8e8;border:1px solid #d9dfbf;box-shadow:0 2px 0 #d1dcb0;font-weight:770;font-size:13px}
.tool .icon{width:17px;height:17px;color:#507653}
.tool b{position:absolute;top:-5px;right:1px;display:grid;place-items:center;min-width:16px;height:16px;padding:0 3px;border-radius:20px;background:#5d8355;color:white;font-size:10px;border:1px solid #f3f6e4}
.tool.waiting{color:#637054;background:#f0f0da}
.tool:disabled{opacity:.47}
.tool:disabled b{background:#767c68}
.tool.restart{background:#edf1d9}
.dock{position:relative;flex:none;border-radius:17px;padding:9px 10px 7px;
  background:repeating-linear-gradient(176deg,transparent 0 8px,#b2794611 10px 11px,transparent 13px 21px),linear-gradient(#eec992,#dca66c);
  border:1px solid #b48153;box-shadow:inset 0 1px #ffebbb,0 3px 0 #b28051,0 6px 12px #674c2726;color:#634527}
.dock-head,.dock-foot{display:flex;align-items:center;justify-content:space-between;gap:6px}
.dock-head{height:29px;margin-bottom:5px}
.dock h2{font-size:14px;white-space:nowrap;font-weight:880}
.count{font-size:13px;font-weight:750;white-space:nowrap;background:#ffedc075;padding:3px 7px;border-radius:7px}
.count strong{font-size:15px}
.tray{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.slot{position:relative;display:grid;place-items:center;aspect-ratio:1 / 1.1;background:linear-gradient(#a5744e,#c48e5d);border-radius:9px;box-shadow:inset 0 2px 4px #69432691,0 1px #f7d19b;min-width:0}
.slot .tile{width:91%;height:91%}
.slot::before{content:"";position:absolute;width:5px;height:5px;border-radius:2px;transform:rotate(45deg);background:#e3b982;opacity:.68}
.dock.warn{animation:danger 1.1s ease-in-out infinite}
.dock.warn .count{color:#7e2822;background:#ffddba}
@keyframes danger{50%{box-shadow:0 0 0 3px #cc504b84,0 3px 0 #b56e50,0 0 18px #c9515794,inset 0 1px #ffe5b5}}
.dock-foot{min-height:25px;padding-top:4px;font-size:12px;font-weight:700}
.dock-foot button{font-size:12px;text-decoration:underline;text-underline-offset:3px;background:transparent;padding:5px 1px;font-weight:820;white-space:nowrap}
.park-wrap{display:flex;align-items:center;gap:5px;margin-left:auto;font-size:12px;font-weight:800}
.park{display:flex;gap:3px;min-width:91px}
.park-cell{width:29px;height:30px;border-radius:7px;background:#a4714d46;display:grid;place-items:center}
.park-cell .tile{width:100%;height:100%;position:relative}
.park-cell .tile:after{content:"";position:absolute;inset:-5px -2px}
.board.fall{filter:grayscale(.8) brightness(.83);transform:translateY(8px) scale(.985);transition:transform .32s ease-out,filter .32s ease-out}
.fx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.sprite,.spark,.combo{position:absolute;top:0;left:0;will-change:transform,opacity;pointer-events:none}
.spark{width:12px;height:12px;color:#ffd56c;filter:drop-shadow(0 1px 1px #aa744870)}
.spark svg{width:100%;height:100%}
.spark.wool{border-radius:48% 55% 50% 49%;background:#fff6d6;border:1px solid #e5c78b;box-shadow:inset 0 -2px #ecd3a0}
.combo{color:#fff9df;font-weight:920;font-size:23px;white-space:nowrap;text-shadow:0 2px #6b5939,1px 0 2px #514526,-1px 0 2px #514526;letter-spacing:.05em}
.veil{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:14px;background:#263b335f;overflow:auto;overscroll-behavior:contain}
.dialog{width:min(100%,414px);max-height:calc(100vh - 28px);max-height:calc(100dvh - 28px);overflow:auto;position:relative;padding:24px 20px 22px;border-radius:24px;
  background:linear-gradient(#fffbee,#f7f3d9);border:1px solid #fefae7;box-shadow:0 6px 0 #9b9d69,0 19px 65px #27372771;outline:0}
.dialog h2{font-size:25px;font-weight:900;letter-spacing:.04em;padding-right:45px}
.dialog p{margin:8px 0 14px;color:#51614b;font-size:14px;line-height:1.6}
.dialog .close{position:absolute;right:13px;top:13px;width:36px;height:36px;border-radius:11px}
.dialog-actions{display:grid;grid-auto-columns:1fr;grid-auto-flow:column;gap:9px;margin-top:14px}
.dialog-actions>*{min-width:0}
.dialog .primary,.dialog .secondary{min-height:45px;font-size:14px;padding:8px}
.level-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:13px 0 15px}
.level-option{border:1px solid #dce3c4;border-radius:9px;background:#f0f3da;padding:8px;min-height:43px;text-align:left;display:flex;align-items:center;gap:7px;font-weight:800;font-size:13px}
.level-option b{font-variant-numeric:tabular-nums;color:#55774a}
.level-option .icon{width:14px;margin-left:auto}
.seed-field,.slider{display:grid;gap:7px;font-size:14px;font-weight:750;margin:11px 0}
.seed-field input,.share-text{width:100%;min-height:42px;border:1px solid #d3debe;border-radius:9px;background:#fffcef;color:#304b3d;padding:8px 9px}
.share-text{display:block;height:95px;font-size:14px;resize:vertical;overflow-wrap:anywhere}
.slider input{width:100%;accent-color:#477357}
.switch-row{display:flex;align-items:center;justify-content:space-between;min-height:43px;padding:6px 0;font-weight:750;font-size:15px;border-bottom:1px solid #dde3c6}
.switch-row input{width:22px;height:22px;accent-color:#477357}
.outcome{text-align:center}
.outcome h2{padding:0}
.outcome-mark{margin:0 auto 5px;width:84px;height:84px;display:grid;place-items:center;border-radius:32px;background:#e8efca;border:1px solid #d6e2af}
.outcome-mark svg{width:74px;height:74px}
.outcome p{margin:9px 0 3px}
.reward{font-weight:780;color:#57704a}
.toast{position:fixed;z-index:40;left:50%;bottom:max(16px,env(safe-area-inset-bottom));max-width:calc(100% - 24px);transform:translateX(-50%);
  background:#304e3f;color:#fff8df;padding:9px 14px;border-radius:10px;box-shadow:0 3px 8px #203c2f4f;font-size:14px;text-align:center;pointer-events:none}
@media (max-width:400px){.app{padding-left:13px;padding-right:13px}.hero{border-radius:24px}.tool{font-size:12px}.game{gap:10px}.tray{gap:3px}}
@media (max-width:340px){.app{padding-left:9px;padding-right:9px}.tools{gap:4px}.tool{gap:3px;padding:4px}.tool .icon{width:15px;height:15px}.dock{padding-left:7px;padding-right:7px}.level-head h1{font-size:23px}}
@media (max-height:650px){.app{padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(10px,env(safe-area-inset-bottom))}.topbar{margin-bottom:10px}.game{gap:8px}.hero{min-height:300px}.home{gap:15px}.hero-copy{padding-top:20px}.home-actions button{min-height:48px}.dock{padding-top:5px;padding-bottom:3px}.tool{min-height:40px}}
@media (prefers-reduced-motion:reduce){.guide svg,.dock.warn{animation:none}.board.fall{transition:none}}
</style>
</head>

    heights[integer(rng, piles)] = depth;

    const col = pile % cols;
    const row = Math.floor(pile / cols);

    const x = left + col*dx + (rng()-.5)*sway + (row%2 ? 3 : -3);

// Choose the three-copy groups first. The harder routes keep several incomplete

function groupRoute(config, level, rng) {

    id:i, type:i%kinds, progress:0

  if (level === 1) return groups.flatMap(group => [1,2,3].map(step => ({...group,step})));

  const route = [];

  let load = 0;
  while (groups.length || open.length) {
    const fresh = groups.filter(group => !open.some(active => active.type === group.type));
    const firsts = open.filter(group => group.progress === 1);
    const pairs = open.filter(group => group.progress === 2);
    let group;
    if (load >= pressure && pairs.length) {
      group = pairs[integer(rng, pairs.length)];
    } else if (firsts.length && (!pairs.length && load >= pressure-1 || !fresh.length || load >= 3 && rng() < .41)) {
      group = firsts[integer(rng, firsts.length)];
    } else if (fresh.length) {
      group = fresh[integer(rng, fresh.length)];
    } else {
      group = pairs[integer(rng, pairs.length)];
    }
    if (group.progress === 0) {
      groups.splice(groups.indexOf(group), 1);
      open.push(group);
    }
    group.progress++;
    route.push({id:group.id, type:group.type, step:group.progress});
    load += group.progress === 3 ? -2 : 1;
    if (group.progress === 3) open.splice(open.indexOf(group), 1);

    exposed.splice(exposed.indexOf(id), 1);

  return route.map(({id:group, type, step}, index) => {
    const seen = layers.get(group) || [];
    const usedPiles = groupPiles.get(group) || [];
    let chosen = -1;
    let high = -Infinity;
    for (const id of pool.exposed) {

    }
    cards[chosen].type = type;
    if (startLayer.has(chosen)) topTypes[type]++;

// Clearing N out of N tiles is the global upper bound. Trying the constructed
// route first and replaying every step with the live rules certifies that optimum.
// There is no reason to search other branches once that bound is reached.
function verifyOptimal(layout) {
  const state = Rules.fresh(layout);
  for (const id of layout.solution) {
    if (!Rules.place(layout, state, id, 'board') || state.result === 'lost') return false;
  }

function trials(layout, seed, total = 96) {
  const rng = randomFrom(seed + '|visible-policies');
  let wins = 0;
  for (let run = 0; run < total; run++) {
    const {cards} = layout;
    const pool = exposedPool(cards);
    const holding = new Uint8Array(14);
    const faceUp = new Uint8Array(14);
    const noise = [.12, .55, 1.1, 2.1][run%4];
    let load = 0;
    let picked = 0;
    while (pool.exposed.length) {
      faceUp.fill(0);
      for (const id of pool.exposed) faceUp[cards[id].type]++;
      let best = -1;
      let high = -Infinity;
      for (const id of pool.exposed) {
        const card = cards[id];
        const held = holding[card.type];
        const certainMatch = faceUp[card.type] + held >= 3;
        const score = (held === 2 ? 20 : held === 1 ? 2.8 : 0) +
          (certainMatch ? 5 : 0) + Math.min(3,faceUp[card.type])*.8 +
          Math.min(3,card.below.length)*.15 + rng()*noise;

      }
      const type = cards[best].type;
      pool.remove(best);
      picked++;
      if (++holding[type] === 3) {
        holding[type] = 0;
        load -= 2;
      } else if (++load === CAPACITY) {

      }
    }
    if (picked === cards.length && load === 0) wins++;

}
function generate(seed, level) {
  const limit = level === 2 ? 200 : level === 1 ? 1 : 12;
  const target = level === 2 ? .2 : [.31,.23,.35,.19,.25,.32,.21,.17][level-3];
  let hardest;
  for (let attempt = 0; attempt < limit; attempt++) {
    const key = JSON.stringify([seed,level,attempt]);
    const rng = randomFrom(key);
    const route = groupRoute(LEVELS[level-1], level, rng);
    const geometry = level === 2 && attempt >= limit-4 ? [72,83,69,69] : GEOMETRY[level-1];
    const layout = positions(LEVELS[level-1],rng,geometry);
    layout.solution = labelPositions(layout, route, level, rng);
    if (!verifyOptimal(layout)) continue;
    layout.attempts = attempt+1;
    layout.difficulty = trials(layout, key, level === 1 ? 24 : 96);
    if (level === 1 || layout.difficulty.rate < target) return layout;
    if (!hardest || layout.difficulty.rate < hardest.difficulty.rate) hardest = layout;
  }
  if (hardest) return hardest;

}

const Rules = {
  fresh({cards}) {
    return {
      alive:cards.map(() => true), types:cards.map(card => card.type),
      tray:[], park:[], uses:{undo:1, move:1, mix:1}, undo:null, result:null
    };
  },
  available(layout, state, id) {
    return state.alive[id] && layout.cards[id].above.every(upper => !state.alive[upper]);
  },
  remaining(state) {
    return state.alive.reduce((n,alive) => n+Number(alive), 0) + state.tray.length + state.park.length;
  },
  groupIntoTray(tray, types, id) {
    let last = tray.length-1;
    while (last >= 0 && types[tray[last]] !== types[id]) last--;
    const index = last < 0 ? tray.length : last+1;
    tray.splice(index, 0, id);
    return index;
  },
  place(layout, state, id, source) {
    if (state.result || state.tray.length >= CAPACITY) return null;
    if (source === 'board' && !this.available(layout,state,id)) return null;
    if (source === 'park' && !state.park.includes(id)) return null;
    const from = source === 'park' ? state.park.indexOf(id) : -1;
    if (source === 'board') state.alive[id] = false;
    else state.park.splice(from, 1);
    const index = this.groupIntoTray(state.tray,state.types,id);
    const matched = state.tray.filter(other => state.types[other] === state.types[id]);
    const cleared = matched.length === 3 ? matched : [];
    const matchSlots = cleared.map(other => state.tray.indexOf(other));
    if (cleared.length) state.tray = state.tray.filter(other => !cleared.includes(other));
    state.undo = {id, source, from, cleared};
    if (state.tray.length === CAPACITY) state.result = 'lost';
    if (!this.remaining(state)) state.result = 'won';
    return {id, index, cleared, matchSlots, tray:[...state.tray], park:[...state.park], result:state.result};
  },
  use(layout, state, tool, seed) {
    if (state.result || !state.uses[tool]) return null;
    let affected = [];
    if (tool === 'undo') {
      if (!state.undo) return null;
      const {id, source, from, cleared} = state.undo;
      state.tray = state.tray.filter(other => other !== id);
      state.park = state.park.filter(other => other !== id);
      for (const other of cleared) {
        if (other !== id) this.groupIntoTray(state.tray,state.types,other);
      }
      if (source === 'board') state.alive[id] = true;
      else state.park.splice(from,0,id);
      state.undo = null;
      affected = [id];
    } else if (tool === 'move') {
      if (state.park.length || state.tray.length < 3) return null;
      affected = state.tray.splice(0,3);
      state.park = [...affected];
    } else if (tool === 'mix') {
      const ids = state.alive.flatMap((alive,id) => alive ? [id] : []);
      if (ids.length < 2) return null;
      const types = ids.map(id => state.types[id]);
      const mixed = shuffle([...types],randomFrom(JSON.stringify([seed,ids,types,'shuffle'])));
      if (mixed.every((type,i) => type === types[i])) {
        const other = types.findIndex(type => type !== types[0]);
        if (other < 0) return null;
        [mixed[0],mixed[other]] = [mixed[other],mixed[0]];
      }
      ids.forEach((id,i) => { state.types[id] = mixed[i]; });
      affected = ids;
    } else {
      return null;
    }
    state.uses[tool]--;
    return affected;
  }
};

class PastureAudio {
  constructor(settings) {
    this.settings = settings;
    this.context = null;
    this.voices = [];
    if ('speechSynthesis' in window) {
      const load = () => { this.voices = window.speechSynthesis.getVoices(); };

  unlock() {
    const Context = window.AudioContext || window.webkitAudioContext;

        const limiter = context.createDynamicsCompressor();
        limiter.threshold.value = -12;
        limiter.ratio.value = 5;
        master.connect(limiter).connect(context.destination);

        this.master = master;
        this.apply();

        const samples = this.noise.getChannelData(0);
        for (let i = 0; i < samples.length; i++) samples[i] = Math.random()*2-1;

    o.frequency.exponentialRampToValueAtTime(end,at+duration);
    g.gain.setValueAtTime(.0001,at);
    g.gain.exponentialRampToValueAtTime(amount,at+.006);
    g.gain.exponentialRampToValueAtTime(.0001,at+duration);
    o.connect(g).connect(this.master);
    o.start(at);
    o.stop(at+duration+.004);

  rustle(from,to,duration,at,amount) {

    const g = this.context.createGain();

    b.type = 'bandpass';
    b.Q.value = 1.15;
    b.frequency.setValueAtTime(from,at);
    b.frequency.exponentialRampToValueAtTime(to,at+duration);
    g.gain.setValueAtTime(.0001,at);
    g.gain.exponentialRampToValueAtTime(amount,at+.006);
    g.gain.exponentialRampToValueAtTime(.0001,at+duration);

    s.stop(at+duration+.004);

      case 'snap':

      case 'match':

        break;
      case 'blocked':
        this.tone(146,115,.105,t,'sine',.31);
        this.tone(128,96,.11,t+.11,'triangle',.22);
        break;
      case 'pulse':
        this.tone(106,57,.14,t,'sine',.33);
        this.tone(91,57,.11,t+.16,'sine',.28);
        break;
      case 'lost':
        this.tone(178,57,.45,t,'triangle',.37);
        this.tone(98,43,.37,t+.024,'sine',.24);
        this.rustle(750,130,.28,t,.23);
        break;
      case 'won':
        this.melody([392,523.25,659.25,783.99,1046.5,1318.5],t,.066,.21);
        this.tone(523.25,521,.25,t+.28,'sine',.14);
        break;
      case 'undo':
        this.rustle(3800,540,.22,t,.46);
        this.tone(450,178,.15,t+.018,'sine',.20);

      || available.find(v => /^zh[-_]cn$/i.test(v.lang)) || available[0];

      const utterance = new SpeechSynthesisUtterance(text);

      utterance.lang = voice.lang;

    } catch {}
  }
}

// Accepted picks reserve board spots immediately. Ordered landing frames commit

function pick(el,source) {
  if (modal || !gameSession || gameSession.state.result) return;
  const {layout,state,level} = gameSession;
  const id = +el.dataset.id;
  if (source === 'board' && !Rules.available(layout,state,id)) {
    if (state.alive[id]) {
      audio.play('blocked');
      nudge(el,10,180);
    }
    return;
  }
  const from = box(el);
  const action = Rules.place(layout,state,id,source);
  if (!action) return;
  const type = state.types[id];
  if (level === 1 && !profile.lesson) profile.lesson = true;
  const keyboardFocus = document.activeElement === el && el.matches(':focus-visible');
  syncBoard();
  syncHud();
  if (source === 'park') paintPark();
  if (keyboardFocus) {
    const next = source === 'board' ? deck.querySelector('button:not([hidden]):not(.covered)') : park.querySelector('button');
    (next || $('restart-btn')).focus({preventScroll:true});
  }
  audio.play('pick');
  const sprite = floatingTile(type,from);
  flights.push({from,action,sprite,t:performance.now(),duration:reduceMotion.matches ? 60 : 250});
  if (action.result === 'won') {
    if (!profile.cleared.includes(level)) profile.cleared.push(level);
    profile.reward = true;

    combo = now-lastMatch < 1450 ? combo+1 : 1;
    lastMatch = now;
    audio.play('match',combo);
    const type = gameSession.state.types[action.id];
    for (const index of action.matchSlots) burst(type,slotAnchors[index],now);
    if (combo > 1) comboLabel(combo,slotAnchors[action.index],now);
  }
  if (action.result) {
    if (action.result === 'lost') board.classList.add('fall');
    pulseAt = Infinity;
    audio.play(action.result);

function useTool(tool) {
  if (modal || !gameSession) return;

  const last = state.undo ? {...state.undo} : null;
  const previousTray = [...state.tray];
  const previousPark = [...state.park];
  const affected = Rules.use(layout,state,tool,seed);
  if (!affected) {
    audio.play('blocked');
    note(tool === 'undo' ? '先选一张牌，再使用撤销' :
      tool === 'move' ? '托盘至少有 3 张牌，且暂存区为空时可用' : '棋盘需要至少两种图案');
    return;
  }
  const now = performance.now();
  while (flights.length) landing(flights.shift(),now);
  const from = tool === 'undo' ? (previousTray.includes(last.id) ? slotAnchors[previousTray.indexOf(last.id)] :
    previousPark.includes(last.id) ? parkAnchors[previousPark.indexOf(last.id)] : slotAnchors[Math.max(0,previousTray.length-1)]) : null;
  syncBoard();
  syncHud();
  paintTray(state.tray);
  paintPark();

  audio.play(tool);

    const to = last.source === 'board' ? box(cards[last.id]) : parkAnchors[state.park.indexOf(last.id)];
    glide(state.types[last.id],from,to,now,95);
    if (last.source === 'board') nudge(cards[last.id],4,175);

  if (tool === 'move') affected.forEach((id,i) => glide(state.types[id],slotAnchors[i],parkAnchors[i],now,70));
  if (tool === 'mix') affected.forEach(id => {

// Touch engines may aim native clicks at a nearby button. Hit-test the actual

function bindTiles(root,source) {
  const pressed = new Map();
  root.addEventListener('touchstart',event => {
    for (const t of Array.from(event.changedTouches)) pressed.set(t.identifier,[t.clientX,t.clientY]);
  },{passive:true});
  root.addEventListener('touchcancel',event => {
    for (const t of Array.from(event.changedTouches)) pressed.delete(t.identifier);
  },{passive:true});
  root.addEventListener('touchend',event => {
    for (const t of Array.from(event.changedTouches)) {
      const start = pressed.get(t.identifier);
      pressed.delete(t.identifier);
      if (!start || Math.hypot(t.clientX-start[0],t.clientY-start[1]) > 14) continue;
      if (event.cancelable) event.preventDefault();
      const el = document.elementFromPoint(t.clientX,t.clientY)?.closest('button[data-id]');
      if (el && root.contains(el) && !el.hidden) pick(el,source);
    }
  },{passive:false});
  root.addEventListener('click',event => {

  });

// One frame loop owns flying tiles, particles, shakes, and delayed audio.
function wake() { if (!frame) frame = requestAnimationFrame(tick); }
function floatingTile(type, from) {

  el.style.height = from.h+'px';

}
function pose(x,y,angle=0,scale=1) {

}
function ease(t) { return 1-(1-t)**3; }
function mix(a,b,p) { return a+(b-a)*p; }

  const t = ease(p);

  const scale = mix(1,to.w*.91/from.w,t)+Math.sin(Math.PI*t)*.13;
  el.style.transform = pose(mix(from.x,to.x,t)-bend,mix(from.y,to.y,t)-rise,Math.sin(Math.PI*t)*turn,scale);

  animated(el,performance.now(),duration,p => {
    const swing = Math.sin(p*Math.PI*5)*(1-p);
    el.style.transform = twist ? 'rotate('+(swing*distance)+'deg) scale('+(1-Math.sin(Math.PI*p)*.12)+')' :

function burst(type,at,now) {
  const ghost = floatingTile(type,{...at,w:at.w*.91,h:at.h*.91});
  animated(ghost,now,reduceMotion.matches ? 80 : 300,p => {
    ghost.style.transform = pose(at.x,at.y-15*p,48*p,1-.85*ease(p));
    ghost.style.opacity = 1-p;
  });
  if (reduceMotion.matches) return;
  for (let i = 0; i < 6; i++) {
    const spark = document.createElement('span');
    const wool = i%3 === 1;
    spark.className = wool ? 'spark wool' : 'spark';
    if (!wool) spark.innerHTML = svg('star');
    const a = Math.PI*2*i/6 + Math.random()*.8;
    const dx = Math.cos(a)*(27+Math.random()*38);
    const dy = Math.sin(a)*(24+Math.random()*40)-16;

    layer.append(spark);

      const k = ease(p);
      spark.style.transform = pose(at.x+dx*k,at.y+dy*k+18*p*p,110*p,.6+Math.sin(Math.PI*p)*.58);

function resetMotion() {

  effects.length = 0;
  layer.replaceChildren();
  pulseAt = spokenAt = outcomeAt = Infinity;
  $('dock').classList.remove('warn');
  toastUntil = 0;
  refillUntil = 0;
  $('toast').hidden = true;

function tick(now) {
  frame = 0;
  while (flights.length && now-flights[0].t >= flights[0].duration) landing(flights.shift(),now);
  for (const {sprite,from,action,t,duration} of flights) {
    trajectory(sprite,from,slotAnchors[action.index],Math.max(0,(now-t)/duration),Math.min(80,from.w*1.3),8);
  }
  for (let i = effects.length-1; i >= 0; i--) {
    const {el,start,duration,draw,remove} = effects[i];

    }

    audio.play('pulse');

  if (now >= outcomeAt) {

  if (now >= spokenAt) {

  }
  if (toastUntil && now >= toastUntil) {
    toastUntil = 0;
    $('toast').hidden = true;
  }
  if (refillUntil && now >= refillUntil) {

  if (event.key !== 'Tab') return;
  const items = Array.from(dialog.querySelectorAll('button:not(:disabled),input,textarea'));
  if (!items.length) return;
  const first = items[0];
  const last = items[items.length-1];
  const active = document.activeElement;
  if (event.shiftKey && (active === first || active === dialog)) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && active === last) {
    event.preventDefault();
    first.focus();
  }
});
updateSettingsIcon();
const launch = new URLSearchParams(location.search);
if (launch.has('seed') || launch.has('level')) {
  const value = Number(launch.get('level'));
  const level = Number.isInteger(value) && value >= 1 && value <= LEVELS.length ? value : 1;
  setGame(level,launch.get('seed'),true);
} else if (saved.scene === 'game' && session) {
  setGame(session.level,session.seed,true);
} else {
  updateHome();
}

</script>
