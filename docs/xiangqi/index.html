<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11100f">
  <meta name="description" content="在楚河棋社开一局中国象棋。支持好友联机、双人同屏、观战和棋谱复盘。">
  <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jR6QAAAAASUVORK5CYII=">
  <title>楚河棋社 · 对弈棋室</title>
  <style>:root {
  color-scheme: dark;
  --bg: #11100f;
  --panel: #1a1917;
  --panel-deep: #161513;
  --line: #39332a;
  --soft-line: #2b2721;
  --gold: #d7ad73;
  --gold-bright: #efd2a0;
  --paper: #f3e7cf;
  --muted: #b5a690;
  --red: #b74235;
  --serif: 'Kaiti SC', STKaiti, KaiTi, 'Songti SC', SimSun, 'Noto Serif CJK SC', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; min-width: 300px; min-height: 100vh;
  color: var(--paper); font: 16px/1.5 var(--sans);
  background: radial-gradient(ellipse at 40% 0%, #2a2018 0%, transparent 55%), var(--bg);
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; }
button { color: inherit; cursor: pointer; transition: background-color .18s, border-color .18s, color .18s, box-shadow .18s, transform .18s; touch-action: manipulation; }
button:not(:disabled):active { transform: translateY(1px); }
button:disabled { cursor: default; opacity: .40; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible, canvas:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 3px; }
button, a, input { -webkit-tap-highlight-color: transparent; }
input, select { min-width: 0; color: var(--paper); background: #151411; border: 1px solid #483c2d; border-radius: 7px; padding: 8px 10px; }
input::placeholder { color: #a39480; }
select { appearance: none; padding-right: 31px; background-image: linear-gradient(45deg, transparent 49%, var(--gold) 51%), linear-gradient(135deg, var(--gold) 49%, transparent 51%); background-size: 5px 5px; background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%; background-repeat: no-repeat; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.masthead { background: #141311ee; border-bottom: 1px solid #443526; }
.mast-inner { max-width: 1210px; padding: 0 32px; margin: auto; min-height: 67px; display: flex; justify-content: space-between; align-items: center; }
.brand { display: inline-flex; align-items: center; gap: 12px; color: var(--paper); text-decoration: none; letter-spacing: .12em; font: 700 23px/1 var(--serif); }
.brand-seal { display: grid; place-items: center; width: 34px; height: 34px; color: #f8dab1; border: 1px solid #cd7963; border-radius: 7px; background: linear-gradient(145deg, #ab3c30, #6d231b); font-size: 22px; letter-spacing: 0; box-shadow: inset 0 0 0 2px #6c271e, inset 0 0 0 3px #c56a54; }
.audio-tools { display: flex; align-items: center; gap: 10px; }
.voice-settings { position: relative; z-index: 5; }
.voice-settings summary { cursor: pointer; color: var(--gold-bright); font-size: 13px; }
.voice-settings[data-warning=true] summary { color: #f6ad8d; }
.voice-menu { position: absolute; top: calc(100% + 12px); right: 0; width: 218px; padding: 16px; display: grid; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px #0006; }
.voice-menu label { display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
.voice-menu input { width: auto; padding: 0; accent-color: var(--gold); }
.voice-menu input[type=range] { width: 92px; }
#voiceStatus { font-size: 12px; color: var(--muted); }
@media(max-width:420px) { .audio-tools { gap: 5px; } .voice-settings summary { max-width: 85px; font-size: 12px; } }
.icon-button { display: inline-grid; place-items: center; border: 1px solid #45392b; border-radius: 8px; width: 36px; height: 36px; padding: 0; background: #211b16; color: var(--gold-bright); font-size: 23px; line-height: 1; }
.icon-button:hover, .quiet-button:hover:not(:disabled) { background: #30251a; border-color: #8c6840; }
.volume-control { display: grid; place-items: center; }
.volume-control input { box-sizing: content-box; width: 66px; accent-color: var(--gold); padding: 0; margin: 0; }
.sound-mark { width: 17px; height: 16px; position: relative; }
.sound-mark::before { content: ''; position: absolute; inset: 0 6px 0 0; clip-path: polygon(0 34%, 36% 34%, 94% 0, 94% 100%, 36% 66%, 0 66%); background: currentColor; }
.sound-mark::after { content: ''; position: absolute; width: 9px; height: 12px; top: 2px; right: 0; border-right: 1.5px solid currentColor; border-radius: 50%; }
[aria-pressed="true"] .sound-mark::after { width: 2px; height: 16px; top: 0; right: 3px; border: 0; border-radius: 1px; background: currentColor; transform: rotate(39deg); box-shadow: -1px 0 #211b16; }
.shell { max-width: 1210px; margin: 0 auto; padding: 26px 32px 34px; }
.titlebar { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 21px; }
h1 { margin: 0; font: 700 clamp(32px, 4vw, 46px)/1.13 var(--serif); letter-spacing: .11em; }
.subtitle { margin-top: 9px; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
.bullet { color: #a27c54; }
.live-dot, .status-tag > span { display: inline-block; width: 6px; height: 6px; vertical-align: 2px; border-radius: 50%; background: #d7aa6d; box-shadow: 0 0 8px #c9905861; }
.modes { display: flex; padding: 4px; gap: 4px; background: #171410; border: 1px solid #4a3827; border-radius: 10px; }
.modes button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; border: 1px solid transparent; border-radius: 7px; padding: 0 15px; color: var(--muted); background: transparent; white-space: nowrap; font-size: 14px; }
.modes button:hover { color: var(--paper); }
.modes button[aria-pressed="true"] { color: var(--gold-bright); background: #382a1c; border-color: #674c32; box-shadow: 0 2px 9px #0a080666; }
.mode-icon { display: inline-block; width: 15px; height: 13px; position: relative; }
.local-icon { border: 1.4px solid currentColor; border-radius: 2px; height: 11px; }
.local-icon::after { content: ''; position: absolute; bottom: 1px; left: 4px; width: 5px; height: 1px; background: currentColor; }
.online-icon::before, .online-icon::after { content: ''; width: 8px; height: 5px; border: 1.3px solid currentColor; border-radius: 6px; position: absolute; transform: rotate(-39deg); }
.online-icon::before { left: 0; bottom: 1px; }
.online-icon::after { right: 0; top: 1px; }
.layout { display: grid; grid-template-columns: minmax(0, 1.92fr) minmax(304px, 1fr); gap: 21px; align-items: start; }
.arena { display: grid; justify-items: center; gap: 10px; border: 1px solid #4a3829; border-radius: 17px; padding: 12px 20px; min-width: 0; background: radial-gradient(ellipse at 50% 43%, #3c281b, #211913 72%, #1c1713); box-shadow: 0 15px 38px #08070555, inset 0 1px #75523830; }
.player { width: min(100%, 541px); min-height: 49px; display: flex; align-items: center; gap: 10px; padding: 0 4px; color: var(--muted); }
.avatar { width: 36px; height: 36px; display: grid; place-items: center; flex: 0 0 auto; color: #e2ccb1; font: 700 22px/1 var(--serif); border-radius: 50%; border: 1px solid #7b6550; background: linear-gradient(145deg, #494038, #24211c); box-shadow: inset 0 0 0 3px #211a145b; }
[data-side="red"] .avatar { background: linear-gradient(145deg, #a33e30, #582117); border-color: #ca7860; color: #ffdfb7; }
.player-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; line-height: 1.25; }
.player-info strong { font-size: 15px; color: var(--paper); }
.player-info span { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player.active .player-info span { color: var(--gold-bright); }
.clock { min-width: 85px; margin-left: auto; padding: 4px 10px; border: 1px solid #503d2e; border-radius: 7px; text-align: center; background: #181410; font: 600 22px/1.25 'Cascadia Mono', Consolas, ui-monospace, monospace; letter-spacing: .02em; color: #c6b9a6; }
.player.active .clock { border-color: #a57849; color: #f7daa7; box-shadow: 0 0 14px #c18a3030; }
.clock[data-byo="true"] { color: #ffc4ae; background: #3c2019; border-color: #934c3b; }
.board-frame { position: relative; width: min(100%, 541px); padding: 7px; border: 1px solid #997047; border-radius: 12px; background: linear-gradient(145deg, #7f5532, #3d2719 57%, #714828); box-shadow: 0 9px 15px #100a05a0, inset 0 0 0 2px #27190e80; }
@media (min-width: 769px) { .board-frame, .player { width: min(100%, 541px, clamp(380px, calc(92dvh - 314px), 541px)); } }
canvas { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; display: block; width: 100%; height: auto; aspect-ratio: 540 / 580; border-radius: 6px; touch-action: none; box-shadow: 0 1px 5px #1c0f09d0; cursor: crosshair; }
.corner { position: absolute; width: 16px; height: 16px; border: 1px solid #e1b379; z-index: 1; pointer-events: none; opacity: .85; }
.tl { left: 3px; top: 3px; border-right: 0; border-bottom: 0; border-radius: 7px 0 0; }
.tr { right: 3px; top: 3px; border-left: 0; border-bottom: 0; border-radius: 0 7px 0 0; }
.bl { left: 3px; bottom: 3px; border-right: 0; border-top: 0; border-radius: 0 0 0 7px; }
.br { right: 3px; bottom: 3px; border-left: 0; border-top: 0; border-radius: 0 0 7px; }
.side-area { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.panel { border: 1px solid var(--line); border-radius: 14px; background: linear-gradient(160deg, #1e1b17, var(--panel-deep) 80%); box-shadow: 0 7px 23px #09080530; min-width: 0; }
.panel-top { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--soft-line); padding: 0 17px; }
.tabs { display: flex; gap: 17px; }
.tabs button { min-width: 58px; min-height: 51px; background: transparent; border: none; border-bottom: 2px solid transparent; padding: 0 2px; color: var(--muted); font-weight: 650; }
.tabs button[aria-selected="true"] { color: var(--gold-bright); border-color: var(--gold); }
.tabs button:hover { color: var(--paper); }
.record-panel { display: flex; flex-direction: column; height: 338px; }
.record-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 4px; color: var(--muted); font-size: 14px; }
.text-button { background: transparent; border: 0; color: var(--gold); min-height: 30px; padding: 2px 3px; font-size: 14px; }
.text-button:hover:not(:disabled) { color: #ffdfae; }
.copy-icon { width: 11px; height: 12px; display: inline-block; border: 1px solid currentColor; border-radius: 2px; vertical-align: -1px; margin-right: 6px; box-shadow: -2px -2px #211b16, -3px -3px currentColor; }
.records { overflow: auto; flex: 1; min-height: 0; padding: 0 12px; scrollbar-color: #6f5340 #201b16; }
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; gap: 5px; color: var(--muted); text-align: center; font-size: 13px; padding: 12px; }
.empty-state strong { color: #e6d5b9; font-size: 15px; font-weight: 600; }
.empty-seal { display: grid; place-items: center; width: 49px; height: 49px; margin: 0 0 9px; border-radius: 12px; border: 1px solid #775535; color: #d4a675; background: #38291b; box-shadow: inset 0 0 0 3px #1f1712, inset 0 0 0 4px #67492e; font: 700 26px/1 var(--serif); transform: rotate(-6deg); }
.record-list { padding: 4px 0; }
.record-row { display: grid; grid-template-columns: 28px 1fr 1fr; align-items: center; gap: 4px; border-bottom: 1px solid #302821; color: var(--muted); font-size: 13px; }
.record-row > span { text-align: center; }
.record-row button { background: transparent; border: 1px solid transparent; border-radius: 5px; min-height: 34px; padding: 2px 4px; font-size: 14px; }
.record-row button[data-side="red"] { color: #f0a38d; }
.record-row button[aria-current="step"], .record-row button:hover { background: #33271c; border-color: #6d5136; }
.replay { min-height: 51px; display: grid; grid-template-columns: 36px 36px 1fr 36px 36px; align-items: center; gap: 5px; border-top: 1px solid var(--soft-line); padding: 6px 12px; text-align: center; font-size: 13px; color: var(--muted); }
.replay button { min-height: 33px; border: 1px solid #473a2c; background: #241d16; border-radius: 6px; padding: 0; color: var(--gold-bright); font-size: 23px; line-height: 1; }
.replay button:hover:not(:disabled) { background: #3a2b1e; border-color: #896441; }
.actions { padding: 15px 15px 12px; }
.action-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
.action-head h2 { font-size: 16px; line-height: 1.4; margin: 0; font-weight: 700; }
.status-tag { font-size: 12px; color: var(--gold-bright); border: 1px solid #55412e; background: #302318; border-radius: 20px; padding: 3px 8px; white-space: nowrap; }
.status-tag > span { margin-right: 6px; }
.action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.action-grid button { display: flex; flex-direction: column; gap: 5px; align-items: center; justify-content: center; min-height: 62px; border: 1px solid #46392e; border-radius: 8px; background: #211b16; color: #dfc8a8; padding: 4px 2px; font-size: 14px; }
.action-grid button:hover:not(:disabled) { background: #33251b; border-color: #926441; box-shadow: 0 2px 10px #1009047a; }
.action-icon { color: var(--gold); font: 22px/19px Georgia, serif; height: 19px; display: grid; place-items: center; }
.draw-icon { font: 600 19px/19px system-ui, sans-serif; }
.flag-icon { position: relative; width: 16px; height: 16px; margin: 1px 0 2px 3px; border-left: 1.5px solid currentColor; }
.flag-icon::before { content: ''; position: absolute; width: 10px; height: 7px; left: -1px; top: 0; border: 1.5px solid currentColor; border-radius: 1px 3px 2px 0; transform: skewY(-8deg); }
.new-game-row { display: grid; grid-template-columns: 1.12fr 1fr; gap: 8px; margin-top: 12px; }
.primary-button, .quiet-button { padding: 7px 11px; min-height: 39px; border-radius: 7px; font-size: 14px; font-weight: 650; white-space: nowrap; }
.primary-button { border: 1px solid #b96d50; background: linear-gradient(140deg, #ab4233, #762b21); color: #ffe5bf; box-shadow: inset 0 1px #f3a77b3d; }
.primary-button:hover:not(:disabled) { background: #af4839; border-color: #df976a; box-shadow: 0 0 14px #a23d304d; }
.quiet-button { border: 1px solid #655038; background: #282018; color: var(--gold-bright); }
.settings-row { display: flex; justify-content: space-between; align-items: center; gap: 9px; margin-top: 13px; padding-top: 9px; border-top: 1px solid var(--soft-line); color: var(--muted); font-size: 13px; }
.settings-row select { padding-top: 5px; padding-bottom: 5px; }
.exit-button { display: block; margin-top: 7px; color: #e5a48c; }
.room-bar { padding: 11px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
.room-bar > div { display: grid; grid-template-columns: auto 1fr; gap: 0 9px; align-items: center; }
.room-bar .room-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; }
#roomLabel, #connectionStatus { color: var(--muted); }
#roomCode { font: 700 22px/1.2 Consolas, monospace; letter-spacing: .12em; color: var(--gold-bright); }
#connectionStatus { grid-column: 1 / -1; }
.chat-panel { height: 338px; display: flex; flex-direction: column; min-height: 0; }
.chat-log { list-style: none; flex: 1; min-height: 0; padding: 10px 13px; overflow: auto; margin: 0; font-size: 14px; overflow-wrap: anywhere; }
.chat-log li { margin: 0 0 8px; }
.chat-log b { color: var(--gold-bright); margin-right: 6px; }
.chat-log [data-who="red"] b { color: #f4a894; }
.chat-log [data-who="system"] { color: var(--muted); font-size: 13px; }
.chat-controls { padding: 9px 12px; border-top: 1px solid var(--soft-line); }
.quick-chat { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.quick-chat button { font-size: 13px; min-height: 30px; padding: 2px 7px; background: #2c2118; color: var(--gold-bright); border: 1px solid #543f2c; border-radius: 5px; }
#chatForm { display: flex; gap: 6px; }
#chatForm input { width: 100%; font-size: 16px; }
#chatForm button { flex: 0 0 auto; border: 1px solid #80593b; border-radius: 6px; background: #4b311e; color: var(--paper); font-size: 14px; }
#unread, #mobileUnread { display: inline-block; font-size: 12px; background: #792e25; border-radius: 9px; padding: 0 4px; }
.mobile-tabs, .drawer-close, .drawer-backdrop { display: none; }
.toast { position: fixed; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 4; left: 50%; transform: translateX(-50%); background: #251c16; color: var(--paper); box-shadow: 0 5px 22px #0008; border: 1px solid #976c43; border-radius: 9px; padding: 9px 15px; width: max-content; max-width: calc(100vw - 24px); font-size: 14px; pointer-events: none; }
.result-card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); min-width: 150px; display: grid; justify-items: center; gap: 6px; padding: 13px 18px; border: 1px solid #a9804e; border-radius: 11px; box-shadow: 0 8px 28px #2415099c; background: #251910ee; backdrop-filter: blur(10px); color: var(--gold-bright); font-size: 14px; }
.result-card strong { font: 700 29px/1.2 var(--serif); white-space: nowrap; }
.result-card button { margin-top: 3px; }
.dialog { width: min(435px, calc(100% - 28px)); max-height: calc(100% - 30px); padding: 19px 20px; background: #221b16f5; backdrop-filter: blur(15px); color: var(--paper); border: 1px solid #8e6743; border-radius: 14px; box-shadow: 0 20px 90px #000a; }
.dialog::backdrop { background: #090706ad; }
.dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.dialog h2 { margin: 0; font: 700 27px/1.2 var(--serif); color: var(--gold-bright); }
.dialog p { margin: 14px 0; color: #d4c2aa; font-size: 15px; }
#dialogText { overflow-wrap: anywhere; white-space: pre-wrap; }
.dialog-actions { display: flex; gap: 8px; justify-content: end; }
.dialog-actions button { min-width: 71px; }
.join-form label, .form-picks label { color: var(--muted); font-size: 14px; }
.join-form > div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px; margin: 4px 0 7px; }
#joinCode { letter-spacing: .24em; }
.watch { display: inline-flex; gap: 4px; align-items: center; }
.watch input { accent-color: var(--gold); }
.create-form { padding-top: 13px; margin-top: 13px; border-top: 1px solid #453426; }
.form-picks { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 10px; }
.form-picks label { display: flex; flex-direction: column; gap: 4px; }
.create-form > button { width: 100%; }

@media (max-width: 900px) {
  .mast-inner { padding-inline: 18px; }
  .shell { padding-inline: 18px; }
  .layout { gap: 12px; }
  .arena { padding-inline: 11px; }
}
@media (max-width: 768px) {
  .mast-inner { min-height: 55px; padding-inline: 13px; }
  .brand { font-size: 20px; gap: 8px; }
  .brand-seal { width: 30px; height: 30px; font-size: 20px; }
  .shell { padding: 13px 9px max(20px, env(safe-area-inset-bottom)); }
  .titlebar { align-items: start; margin: 0 3px 11px; gap: 8px; }
  h1 { font-size: 29px; letter-spacing: .05em; }
  .subtitle { margin-top: 6px; font-size: 12px; gap: 5px; }
  .subtitle .live-dot { display: none; }
  .modes { padding: 2px; gap: 1px; }
  .modes button { padding-inline: 7px; gap: 4px; min-height: 35px; font-size: 13px; }
  .modes .mode-icon { display: none; }
  .layout { display: flex; flex-direction: column; gap: 9px; }
  .arena, .side-area { width: 100%; }
  .arena { gap: 5px; padding: 5px 6px 8px; border-radius: 11px; }
  .board-frame { padding: 4px; border-radius: 8px; }
  .player { min-height: 39px; }
  .avatar { width: 31px; height: 31px; font-size: 18px; }
  .clock { font-size: 18px; min-width: 68px; }
  .mobile-tabs { display: grid; width: min(100%,541px); grid-template-columns: 1fr 1fr; gap: 6px; }
  .mobile-tabs button { min-height: 36px; }
  .side-area { display: grid; gap: 7px; }
  .inspector { display: none; }
  .inspector.drawer-open { display: block; position: fixed; z-index: 6; inset: auto 0 0; padding-bottom: env(safe-area-inset-bottom); border-radius: 15px 15px 0 0; }
  .drawer-backdrop:not([hidden]) { display: block; position: fixed; inset: 0; z-index: 5; background: #080605a0; }
  .drawer-close { display: inline-grid; }
  .record-panel, .chat-panel { height: min(339px, 53dvh); }
  .chat-panel { min-height: 187px; }
  .actions { padding: 11px; }
  .action-grid button { min-height: 50px; }
  .room-bar { grid-row: 1; }
}
@media (max-width: 360px) { .subtitle .bullet, #modeCaption { display: none; } .volume-control input { width: 48px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
</style>
</head>
<body>
  <header class="masthead">
    <div class="mast-inner">
      <a class="brand" href="./" aria-label="楚河棋社首页"><span class="brand-seal" aria-hidden="true">弈</span><span>楚河棋社</span></a>
      <div class="audio-tools">
        <button id="mute" class="icon-button" type="button" aria-pressed="false" aria-label="静音" title="静音"><span class="sound-mark" aria-hidden="true"></span></button>
        <label class="volume-control"><span class="sr-only">总音量</span><input id="volume" type="range" min="0" max="100" value="70"></label>
        <details id="voiceSettings" class="voice-settings">
          <summary id="voiceSummary">点击开始以启用声音</summary>
          <div class="voice-menu">
            <label>人声播报<input id="voiceEnabled" type="checkbox" checked></label>
            <label>人声音量<input id="voiceVolume" type="range" min="0" max="100" value="80"></label>
            <span id="voiceStatus" role="status">点击开始以启用声音</span>
          </div>
        </details>
      </div>
    </div>
  </header>

  <main class="shell">
    <section class="titlebar" aria-labelledby="page-title">
      <div><h1 id="page-title">对弈棋室</h1><div class="subtitle"><span class="live-dot"></span><span id="modeCaption">本地同屏</span><span class="bullet">·</span><span id="timeCaption">15 分钟 + 30 秒读秒</span></div></div>
      <div class="modes" role="group" aria-label="对战模式">
        <button id="localMode" aria-pressed="true" type="button"><span class="mode-icon local-icon" aria-hidden="true"></span>本地同屏</button>
        <button id="onlineMode" aria-pressed="false" type="button"><span class="mode-icon online-icon" aria-hidden="true"></span>好友联机</button>
      </div>
    </section>

    <div class="layout">
      <section class="arena" aria-label="对弈">
        <div id="topPlayer" class="player" data-side="black">
          <div class="avatar" aria-hidden="true">将</div><div class="player-info"><strong>黑方</strong><span>后手</span></div><div class="clock">15:00</div>
        </div>
        <div class="board-frame">
          <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
          <canvas id="board" width="540" height="580" tabindex="0" aria-label="象棋棋盘，可用方向键移动光标，回车选中或落子" aria-describedby="boardHelp"></canvas>
          <span class="sr-only" id="boardHelp">点击棋子并点击高亮交叉点，也可拖动棋子落子。</span>
          <div id="resultCard" class="result-card" hidden><strong id="resultTitle"></strong><span id="resultReason"></span><button id="reviewResult" type="button" class="quiet-button">查看棋局</button></div>
        </div>
        <div id="bottomPlayer" class="player active" data-side="red">
          <div class="avatar" aria-hidden="true">帅</div><div class="player-info"><strong>红方</strong><span>先手 · 正在走棋</span></div><div class="clock">15:00</div>
        </div>
        <div class="mobile-tabs"><button id="mobileRecord" type="button" class="quiet-button">棋谱</button><button id="mobileChat" type="button" class="quiet-button">聊天 <span id="mobileUnread" hidden></span></button></div>
      </section>

      <aside class="side-area" aria-label="棋谱和对局操作">
        <section id="roomBar" class="room-bar panel" hidden aria-label="联机房间">
          <div><span id="roomLabel">房间码</span><strong id="roomCode"></strong><span id="connectionStatus"></span></div>
          <div class="room-actions">
            <button id="claimSeat" type="button" class="quiet-button" hidden>申请入座</button>
            <button id="invite" type="button" class="quiet-button">复制邀请</button>
          </div>
        </section>
        <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
        <section id="inspector" class="panel inspector" aria-label="棋谱和聊天">
          <div class="panel-top">
            <div class="tabs" role="tablist" aria-label="侧栏">
              <button id="recordTab" type="button" role="tab" aria-controls="recordPanel" aria-selected="true">棋谱</button>
              <button id="chatTab" type="button" role="tab" aria-controls="chatPanel" aria-selected="false">聊天 <span id="unread" hidden></span></button>
            </div>
            <button id="closeDrawer" class="icon-button drawer-close" type="button" aria-label="关闭抽屉">×</button>
          </div>
          <div id="recordPanel" class="tab-panel record-panel" role="tabpanel" aria-labelledby="recordTab">
            <div class="record-head"><span id="plyCount">0 手</span><button id="copyRecord" type="button" class="text-button" disabled><span aria-hidden="true" class="copy-icon"></span>复制棋谱</button></div>
            <div id="records" class="records">
              <div id="emptyRecord" class="empty-state"><span class="empty-seal" aria-hidden="true">谱</span><strong>暂无走棋记录</strong><span>走出第一步即可生成棋谱</span></div>
              <div id="recordList" class="record-list" hidden></div>
            </div>
            <div class="replay" aria-label="复盘控制">
              <button id="firstPly" type="button" title="初始局面" aria-label="初始局面" disabled>«</button>
              <button id="prevPly" type="button" title="后退一手" aria-label="后退一手" disabled>‹</button>
              <span id="replayLabel">实时对局</span>
              <button id="nextPly" type="button" title="前进一手" aria-label="前进一手" disabled>›</button>
              <button id="lastPly" type="button" title="返回实时对局" aria-label="返回实时对局" disabled>»</button>
            </div>
          </div>
          <div id="chatPanel" class="tab-panel chat-panel" role="tabpanel" aria-labelledby="chatTab" hidden>
            <div id="chatEmpty" class="empty-state"><span class="empty-seal" aria-hidden="true">言</span><strong>房间内聊天</strong><span>加入联机房间后可以发送消息</span></div>
            <ol id="chatLog" class="chat-log" aria-label="房间消息" hidden></ol>
            <div id="chatControls" class="chat-controls" hidden>
              <div class="quick-chat"><button type="button" data-phrase="快点">快点</button><button type="button" data-phrase="好棋">好棋</button><button type="button" data-phrase="再来一局">再来一局</button></div>
              <form id="chatForm"><label for="chatInput" class="sr-only">聊天消息</label><input id="chatInput" maxlength="120" autocomplete="off" placeholder="说点什么…"><button type="submit">发送</button></form>
            </div>
          </div>
        </section>

        <section class="panel actions" aria-labelledby="actionTitle">
          <div class="action-head"><h2 id="actionTitle">对局操作</h2><span id="actionStatus" class="status-tag"><span></span>进行中</span></div>
          <div class="action-grid">
            <button id="undo" type="button" disabled><span class="action-icon" aria-hidden="true">↶</span><span id="undoLabel">悔棋</span></button>
            <button id="draw" type="button"><span class="action-icon draw-icon" aria-hidden="true">=</span>求和</button>
            <button id="resign" type="button"><span class="action-icon flag-icon" aria-hidden="true"></span>认输</button>
          </div>
          <div class="new-game-row"><button id="newGame" type="button" class="primary-button">再来一局</button><button id="swap" type="button" class="quiet-button">交换先手</button></div>
          <div id="localSettings" class="settings-row"><label for="localTime">计时设置</label><select id="localTime"><option value="standard">标准计时</option><option value="unlimited">不限时</option></select></div>
          <button id="exit" type="button" class="text-button exit-button" hidden>退出房间</button>
        </section>
      </aside>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="dialog" class="dialog" aria-labelledby="dialogTitle">
    <div class="dialog-head"><h2 id="dialogTitle"></h2><button id="dialogClose" type="button" class="icon-button" aria-label="关闭">×</button></div>
    <div id="confirmBody" hidden><p id="dialogText"></p><div class="dialog-actions"><button id="dialogCancel" type="button" class="quiet-button">取消</button><button id="dialogOk" type="button" class="primary-button">确认</button></div></div>
    <div id="lobbyBody" hidden>
      <p id="lobbyHint">创建房间，或使用棋友发来的 4 位房间码。</p>
      <form id="joinForm" class="join-form"><label for="joinCode">房间码</label><div><input id="joinCode" inputmode="numeric" autocomplete="off" maxlength="4" pattern="[0-9]{4}" placeholder="0000" required><button id="join" type="submit" class="primary-button">加入房间</button></div><label class="watch"><input id="watch" type="checkbox"> 仅观战</label></form>
      <form id="createForm" class="create-form"><div class="form-picks"><label>房主执色<select id="colorChoice"><option value="random">随机</option><option value="red">执红</option></select></label><label>计时<select id="onlineTime"><option value="standard">标准计时</option><option value="unlimited">不限时</option></select></label></div><button id="create" type="submit" class="quiet-button">创建房间</button></form>
    </div>
    <div id="offerBody" hidden><p id="offerText"></p><div class="dialog-actions"><button id="decline" type="button" class="quiet-button">拒绝</button><button id="accept" type="button" class="primary-button">同意</button></div></div>
  </dialog>
